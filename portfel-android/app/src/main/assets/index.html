/* PORTFEL+ 2.1 unified palette */
:root{color-scheme:dark;--pp-panel:#0d2a40;--pp-border:#21637a;--pp-accent:#00dda1}
body:not(.light) .card,body:not(.light) form.card{background:linear-gradient(145deg,#10354d,#09263b);border-color:#22647b}
body:not(.light) input,body:not(.light) select,body:not(.light) textarea{background:#092137;color:#f4fbff;border:1px solid #35718b;border-radius:12px}
body:not(.light) input:focus,body:not(.light) select:focus,body:not(.light) textarea:focus{outline:2px solid #19dcb5;outline-offset:1px}
body:not(.light) button.secondary{background:#143b54;color:#e9faff;border:1px solid #33758c}
body:not(.light) button.secondary.danger{color:#ff8fa0;border-color:#8d405b}
body:not(.light) .line{border-color:#28576d}
body:not(.light) .muted,body:not(.light) .notice,body:not(.light) small{color:#bdd1de}
body:not(.light) .category-tile{background:linear-gradient(145deg,#14506b,#0b304b);border-color:#3387a0}
body:not(.light) .bill-item{border-color:#326078}
body:not(.light) .choice span{background:#103b54;border-color:#36788e}
body:not(.light) .choice input:checked+span{background:#087e6b;border-color:#3ef2b5}
.quick-config{display:flex;align-items:center;gap:10px;min-width:0;flex:1;font-weight:650}
.quick-config input{width:20px;height:20px;accent-color:#00d69c;flex-shrink:0;margin:0}
.quick-config span{overflow-wrap:anywhere}
body.light{color-scheme:light}
body.light .card,body.light form.card{background:#fff;border-color:#cfdfeb}
body.light input,body.light select,body.light textarea{background:#f6faff;color:#163448;border-color:#a8c3d5}
body.light button.secondary{background:#e7f2f8;color:#12364d;border-color:#bdd6e5}
body.light .quick-config{color:#173449}

/* PORTFEL+ 2.2: category chooser mirrors colorful home shortcuts */
.category-grid{gap:12px}
.category-tile{min-height:144px;justify-content:center;gap:12px;padding:18px 8px;color:#fff!important;border:1px solid #ffffff55!important;box-shadow:inset 0 1px 0 #ffffff44,0 7px 14px #0003;font-weight:750}
.category-tile span{font-size:38px;filter:drop-shadow(0 2px 2px #0004)}
.category-tile b{font-size:17px}
.category-tile.blue,body:not(.light) .category-tile.blue,body.light .category-tile.blue{background:linear-gradient(135deg,#1177e7,#074caa)}
.category-tile.orange,body:not(.light) .category-tile.orange,body.light .category-tile.orange{background:linear-gradient(135deg,#ffab22,#de6500)}
.category-tile.green,body:not(.light) .category-tile.green,body.light .category-tile.green{background:linear-gradient(135deg,#1ccc50,#087b3a)}
.category-tile.purple,body:not(.light) .category-tile.purple,body.light .category-tile.purple{background:linear-gradient(135deg,#a15aff,#5926b3)}
.category-tile.cyan,body:not(.light) .category-tile.cyan,body.light .category-tile.cyan{background:linear-gradient(135deg,#19b7c8,#07688e)}
.category-tile.red,body:not(.light) .category-tile.red,body.light .category-tile.red{background:linear-gradient(135deg,#ff5469,#a51943)}
body.light .category-tile{color:#fff!important}
@media(max-width:380px){.category-tile{min-height:125px}.category-tile span{font-size:33px}}

(()=>{'use strict';const KEY='dbpro_v02';const defaults=()=>({expenses:[],members:[{id:'m1',name:'Ja'}],categories:['Zakupy','Rachunki','Opłaty','Rozrywka','Paliwo','Polisy'],billItems:['Telefon','Internet','Kredyt'],theme:'light',activeMemberId:'m1',quickCategories:['Zakupy','Paliwo','Rachunki','Polisy']});let db;try{db=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{db=defaults()}if(!localStorage.getItem('portfel23_theme_migrated')){db.theme='light';localStorage.setItem('portfel23_theme_migrated','1');localStorage.setItem(KEY,JSON.stringify(db));}if(!Array.isArray(db.billItems))db.billItems=['Telefon','Internet','Kredyt'];if(!db.categories.includes('Polisy'))db.categories.push('Polisy');if(!db.categories.includes('Rachunki'))db.categories.splice(Math.min(1,db.categories.length),0,'Rachunki');if(!Array.isArray(db.quickCategories))db.quickCategories=['Zakupy','Paliwo','Rachunki','Polisy'];db.quickCategories=db.quickCategories.filter(c=>db.categories.includes(c));let selectedDay=[new Date().getFullYear(),String(new Date().getMonth()+1).padStart(2,'0'),String(new Date().getDate()).padStart(2,'0')].join('-'),addStep='category',chosenCategory=null;let tab='home',editing=null,filter='all',person='all',search='' ,reportPeriod='month',historyPeriod='month',historyCategory='all',historyView='expenses',renewalSource=null,month=new Date().toISOString().slice(0,7);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(n),save=()=>{localStorage.setItem(KEY,JSON.stringify(db))},member=id=>db.members.find(x=>x.id===id)?.name||'Nieznany',uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),current=()=>db.expenses.filter(e=>e.date.slice(0,7)===month),sum=a=>a.reduce((s,e)=>s+Number(e.amount),0),opts=(a,v)=>a.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('');function selectMonth(){return `<label>Miesiąc <input type="month" id="month" value="${month}"></label>`}function lines(arr){return arr.length?arr.sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created)).map(e=>`<div class="line"><div class="grow"><b>${esc(e.description||e.category)}</b><br><small>${esc(e.date)} · ${esc(e.category)} · ${esc(member(e.memberId))}${e.category==='Polisy'&&e.coverageFrom&&e.coverageTo?`<br>Ochrona: ${esc(e.coverageFrom)} – ${esc(e.coverageTo)}`:''}${e.category==='Polisy'&&e.paymentMode==='installments'?`<br>Raty (${e.installmentCount}): ${(e.installmentDates||[]).map((d,i)=>'Rata '+(i+2)+': termin '+esc(d)+' · '+(e.installmentPayments?.[i]?.amount>0?('wpłacono '+money(e.installmentPayments[i].amount)+' dnia '+esc(e.installmentPayments[i].paidAt||'—')):(e.installmentPaid?.[i]?'opłacona (starszy zapis)':'niezapłacona'))).join('; ')}`:''}</small><br><span class="tag ${e.visibility==='private'?'private':''}">${e.visibility==='private'?'🔒 Prywatny':'♧ Wspólny'}</span></div><div style="text-align:right"><b>${money(e.amount)}</b><br><button class="secondary" data-edit="${esc(e.id)}">Edytuj</button></div></div>`).join(''):'<div class="empty">Brak wydatków w tym widoku</div>'}function home(){let a=db.expenses.filter(e=>e.date===selectedDay),shared=a.filter(e=>e.visibility==='shared'),m=db.expenses.filter(e=>e.date.slice(0,7)===selectedDay.slice(0,7));let date=new Date(selectedDay+'T12:00:00');const icons={'Zakupy':'🛒','Rachunki':'⌂','Opłaty':'🏠','Rozrywka':'🎬','Paliwo':'⛽','Polisy':'🛡️','Transport':'🚗','Zdrowie':'♥'};const colorByName={'Zakupy':'green','Paliwo':'orange','Rachunki':'blue','Polisy':'purple','Rozrywka':'red','Transport':'cyan','Zdrowie':'red','Opłaty':'blue'};return `<section class="card hero home-hero"><div class="label">Wydatki w dniu ${date.toLocaleDateString('pl-PL')}</div><div class="big">${money(sum(a))}</div><div class="hero-sub">Wspólne: ${money(sum(shared))} · Prywatne: ${money(sum(a.filter(e=>e.visibility==='private')))}</div><div class="hero-mini">Podsumowanie miesiąca: <b>${money(sum(m))}</b></div></section><section class="card date-strip"><label>Data wpisu<input type="date" id="selected-day" value="${selectedDay}" aria-label="Wybierz dzień"></label><button class="secondary" id="today">Dzisiaj</button></section><div class="section-head"><h3>Szybkie wpisy</h3><small>Twoje skróty</small></div><div class="quick-grid home-shortcuts">${db.categories.filter(c=>db.quickCategories.includes(c)).map((c,i)=>`<button class="quick-tile ${colorByName[c]||['blue','orange','green','purple','cyan','red'][db.categories.indexOf(c)%6]}" data-category="${esc(c)}"><span class="tile-icon">${icons[c]||'▣'}</span><b>${esc(c)}</b></button>`).join('')||'<p class="muted">Wybierz skróty w Ustawieniach.</p>'}</div><button class="primary add-tile" data-tab="add">＋ Dodaj wydatek</button><button class="home-report" data-tab="stats">▥ Zobacz raporty i pełną historię ›</button>`} 
function policyActive(e){return e.category==='Polisy'&&!e.renewedBy&&e.coverageTo>=new Date().toLocaleDateString('sv-SE')}
function policyPaymentSummary(e){if(e.paymentMode!=='installments')return '';let parts=['Rata 1: termin '+esc(e.firstInstallmentDue||e.date)+' · wpłacono '+money(e.amount)+' dnia '+esc(e.date)];(e.installmentDates||[]).forEach((due,i)=>{let p=e.installmentPayments?.[i];parts.push('Rata '+(i+2)+': termin '+esc(due)+' · '+(p?.amount>0?money(p.amount)+' dnia '+esc(p.paidAt||'—'):(e.installmentPaid?.[i]?'opłacona (starszy zapis)':'do zapłaty')))});return '<details><summary>Rozliczenie rat</summary><div style="min-width:230px;line-height:1.8">'+parts.join('<br>')+'</div></details>'}
function policyTable(items,allowRenew){return '<div class="table-scroll"><table class="data-table"><thead><tr><th>Polisa</th><th>Ochrona</th><th>Składka</th><th>Status</th><th>Akcje</th></tr></thead><tbody>'+items.map(e=>`<tr><td><b>${esc(e.policyName||e.description)}</b><small>${esc(member(e.memberId))}</small></td><td>${esc(e.coverageFrom||'—')}<br>${esc(e.coverageTo||'—')}</td><td>${money(e.amount)}<small>${e.paymentMode==='installments'?'Raty: '+Number(e.installmentCount||1):'Całość'}</small>${policyPaymentSummary(e)}</td><td>${e.renewedBy?'Wznowiona':policyActive(e)?'Aktywna':'Wygasła'}</td><td><button class="secondary" data-edit="${esc(e.id)}">Edytuj</button>${allowRenew&&!e.renewedBy?`<button class="primary" data-policy-renew="${esc(e.id)}">Wznów</button>`:''}</td></tr>`).join('')+'</tbody></table></div>'}
function policyOverview(){let active=db.expenses.filter(policyActive).sort((a,b)=>a.coverageTo.localeCompare(b.coverageTo));return `<section class="card"><h3>Aktywne polisy (${active.length})</h3>${active.length?policyTable(active,true):'<p class="muted">Brak aktywnych polis.</p>'}<button type="button" class="secondary" data-history-view="policies">Historia polis ›</button></section>`}
function historyBills(){let bills=db.expenses.filter(e=>e.category==='Rachunki'&&(e.billMonth||e.date.slice(0,7))===month).sort((a,b)=>a.date.localeCompare(b.date));return `<h2>Historia rachunków miesięcznych</h2>${selectMonth()}<section class="card"><div class="table-scroll"><table class="data-table"><thead><tr><th>Rachunek</th><th>Miesiąc</th><th>Wpłata</th><th>Kwota</th><th>Akcja</th></tr></thead><tbody>${bills.map(e=>`<tr><td><b>${esc(e.billItem||e.description)}</b></td><td>${esc(e.billMonth||e.date.slice(0,7))}</td><td>${esc(e.date)}</td><td><b>${money(e.amount)}</b></td><td><button class="secondary" data-edit="${esc(e.id)}">Edytuj</button></td></tr>`).join('')||'<tr><td colspan="5">Brak rachunków w tym miesiącu</td></tr>'}</tbody></table></div><p><b>Razem: ${money(sum(bills))}</b></p></section>`}
function historyPolicies(){let a=db.expenses.filter(e=>e.category==='Polisy').sort((a,b)=>(b.coverageTo||'').localeCompare(a.coverageTo||''));return `<h2>Historia polis</h2><p class="notice">Wszystkie polisy: aktywne, wygasłe i wznowione. Rozwiń raty przez Edytuj.</p><section class="card">${a.length?policyTable(a,true):'<p class="muted">Nie zapisano jeszcze żadnej polisy.</p>'}</section>`}
function history(){if(historyView==='bills')return historyTabs()+historyBills();if(historyView==='policies')return historyTabs()+historyPolicies();return historyTabs()+historyExpenses()}
function historyTabs(){return `<div class="period-tabs history-types">${[['expenses','Wydatki'],['policies','Historia polis'],['bills','Rachunki miesięczne']].map(([v,t])=>`<button class="${historyView===v?'selected':''}" data-history-view="${v}">${t}</button>`).join('')}</div>`}
function historyExpenses(){let a=periodExpenses(historyPeriod).filter(e=>(historyCategory==='all'||e.category===historyCategory)&&(filter==='all'||e.visibility===filter)&&(person==='all'||e.memberId===person)&&(!search||[e.description,e.category,member(e.memberId)].join(' ').toLocaleLowerCase('pl').includes(search.toLocaleLowerCase('pl'))));return `<h2>Historia wydatków</h2><div class="period-tabs">${[['month','Miesiąc'],['quarter','Kwartał'],['year','Rok']].map(([v,t])=>`<button class="${historyPeriod===v?'selected':''}" data-history-period="${v}">${t}</button>`).join('')}</div>${selectMonth()}<label>Kategoria<select id="history-category"><option value="all">Wszystkie kategorie</option>${db.categories.map(c=>`<option value="${esc(c)}" ${historyCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Szukaj wydatku<input id="search" placeholder="Opis, kategoria, domownik" value="${esc(search)}"></label><div class="row"><div class="grow"><label>Widoczność<select id="filter">${opts(['all','shared','private'],filter).replace('>all<','>Wszystkie<').replace('>shared<','>Wspólne<').replace('>private<','>Prywatne<')}</select></label></div><div class="grow"><label>Domownik<select id="person"><option value="all">Wszyscy</option>${db.members.map(m=>`<option value="${esc(m.id)}" ${person===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label></div></div><section class="card">${lines(a)}</section><b>Razem: ${money(sum(a))}</b>`}function add(){let existing=db.expenses.find(x=>x.id===editing);if(!editing&&addStep==='category')return `<h2>Wybierz kategorię</h2><p class="muted">Nowy wydatek · ${selectedDay}</p><div class="category-grid">${db.categories.map((c,i)=>`<button class="category-tile ${['blue','orange','green','purple','cyan','red'][i%6]}" data-category="${esc(c)}"><span>${({'Zakupy':'🛒','Rachunki':'🧾','Opłaty':'🧾','Rozrywka':'🎬','Paliwo':'⛽','Polisy':'🛡️'})[c]||'▣'}</span><b>${esc(c)}</b></button>`).join('')}</div><button class="secondary" data-tab="settings">⚙ Zarządzaj kategoriami</button>`;if(!editing&&chosenCategory==='Rachunki')return bills();let e=existing||(renewalSource?{...renewalSource,id:null,amount:'',date:selectedDay,coverageFrom:selectedDay,coverageTo:'',paymentMode:'full',installmentCount:1,installmentDates:[]}:null)||{amount:'',date:selectedDay,category:chosenCategory||db.categories[0]||'Inne',memberId:(db.members.some(m=>m.id===db.activeMemberId)?db.activeMemberId:db.members[0]?.id),visibility:'shared',description:'',subcategory:'Spożywcze'};return `<h2>${editing?'Edytuj wydatek':'Nowy wydatek'} · ${esc(e.category)}</h2><form id="expense" class="card"><input type="hidden" name="category" value="${esc(e.category)}">${e.category==='Polisy'?`<label class="policy-name-label">Nazwa polisy<input class="policy-name-input" name="policyName" required maxlength="150" placeholder="np. OC samochodu" value="${esc(e.policyName||e.description||'')}"></label>`:''}${e.category!=='Polisy'?`<div class="quick-save-top"><button class="primary" type="submit">${editing?'Zapisz zmiany':'Zapisz'}</button></div>`:''}<div class="amount-date"><div class="amount-box"><label>KWOTA (PLN)</label><input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required placeholder="0,00" value="${esc(e.amount)}"></div><div class="date-box"><label>${e.category==='Polisy'?'DATA ZAPŁATY':'DATA'}</label><input name="date" type="date" required value="${esc(e.date)}"></div></div>${e.category==='Polisy'?`<section class="policy-dates"><h3>Okres ochrony</h3><div class="choice-grid"><label>OD<input name="coverageFrom" type="date" required value="${esc(e.coverageFrom||e.date)}"></label><label>DO<input name="coverageTo" type="date" required value="${esc(e.coverageTo||'')}"></label></div><p class="notice">Data przy kwocie to data zapłaty składki. Okres ochrony jest zapisywany oddzielnie.</p></section><section class="policy-dates"><h3>Sposób opłacenia składki</h3><div class="choice-grid"><label class="choice"><input type="radio" name="paymentMode" value="full" ${(e.paymentMode||'full')==='full'?'checked':''}><span>✓ Całość</span></label><label class="choice"><input type="radio" name="paymentMode" value="installments" ${e.paymentMode==='installments'?'checked':''}><span>◷ Raty</span></label></div><div id="installment-fields" ${e.paymentMode==='installments'?'':'hidden'}><div class="installment-row" style="padding:12px;margin:10px 0;border:1px solid #36718b;border-radius:12px"><b>Rata 1</b><label>Termin pierwszej raty<input type="date" name="firstInstallmentDue" value="${esc(e.firstInstallmentDue||e.date||selectedDay)}"></label><p class="notice">Data zapłaty i wpłacona kwota pierwszej raty znajdują się u góry formularza.</p></div><label>Liczba rat<select name="installmentCount" id="installment-count">${[2,3,4,6,12].map(n=>`<option value="${n}" ${Number(e.installmentCount||2)===n?'selected':''}>${n}</option>`).join('')}</select></label><p class="notice">Kwota u góry to kwota zapłacona teraz (pierwsza rata). Każda kolejna rata ma własny termin, datę zapłaty i wpłaconą kwotę. Puste pola zapłaty oznaczają ratę niezapłaconą.</p><div id="installment-schedule"></div></div></section>`:''}${e.category==='Zakupy' ?`<h3>Rodzaj zakupów</h3><div class="choice-grid">${['Spożywcze','Przemysłowe'].map(v=>`<label class="choice"><input type="radio" name="subcategory" value="${v}" ${((e.subcategory||'Spożywcze')===v)?'checked':''}><span>${v}</span></label>`).join('')}</div>`:''}<h3>Osoba płacąca</h3><div class="choice-grid">${db.members.map(m=>`<label class="choice"><input type="radio" name="memberId" value="${esc(m.id)}" ${e.memberId===m.id?'checked':''}><span>👤 ${esc(m.name)}</span></label>`).join('')}</div><h3>Rodzaj wydatku</h3><div class="choice-grid"><label class="choice"><input type="radio" name="visibility" value="shared" ${e.visibility==='shared'?'checked':''}><span>♧ Wspólny</span></label><label class="choice"><input type="radio" name="visibility" value="private" ${e.visibility==='private'?'checked':''}><span>🔒 Prywatny</span></label></div>${e.category==='Polisy'?'':`<label>Opis (opcjonalnie)<input name="description" maxlength="150" value="${esc(e.description)}" placeholder="Za co zapłacono?"></label>`}<p class="notice">Offline: prywatne wpisy nie są chronione przed innymi osobami używającymi tego telefonu.</p>${e.category==='Polisy'?`<div class="action-grid"><button class="primary" type="submit">${editing?'Zapisz zmiany':'Zapisz'}</button><button class="secondary" type="button" id="edit-action">Edytuj</button></div>`:`<div class="action-grid"><button class="secondary" type="button" id="edit-action">Edytuj</button></div>`}${editing?'<button class="secondary danger" type="button" id="delete">Usuń wydatek</button>':''}<button class="secondary" type="button" id="cancel">Anuluj</button></form>${e.category==='Polisy'?policyOverview():''}`}function bills(){let ym=selectedDay.slice(0,7);return `<h2>Rachunki miesięczne</h2><section class="card"><label>Miesiąc rozliczeniowy<input type="month" id="bill-month" value="${ym}"></label><p class="notice">Każdy rachunek ma osobną kwotę i datę wpłaty. Strzałkami ↑ ↓ zmienisz kolejność rachunków. Zapisane pozycje można poprawiać w Historii.</p></section><form id="bills" class="card"><h3>Lista rachunków</h3>${db.billItems.map((name,i)=>{let old=db.expenses.find(e=>e.category==='Rachunki'&&e.billMonth===ym&&e.billItem===name);return `<div class="bill-item"><div class="row" style="justify-content:space-between"><b>${esc(name)}</b><button type="button" class="secondary" data-bill-up="${i}" ${i===0?'disabled':''} aria-label="Przesuń ${esc(name)} w górę">↑</button><button type="button" class="secondary" data-bill-down="${i}" ${i===db.billItems.length-1?'disabled':''} aria-label="Przesuń ${esc(name)} w dół">↓</button><button type="button" class="secondary" data-bill-rename="${i}" aria-label="Zmień nazwę ${esc(name)}">✎</button><button type="button" class="secondary danger" data-bill-remove="${i}" aria-label="Usuń ${esc(name)}">×</button></div><div class="bill-fields"><label>Kwota (zł)<input type="number" name="bill-amount-${i}" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" value="${old?esc(old.amount):''}"></label><label>Data wpłaty<input type="date" name="bill-date-${i}" value="${old?esc(old.date):selectedDay}"></label></div><small>${old?'Zapisano · można zmienić kwotę lub datę':'Jeszcze nie zapisano'}</small></div>`}).join('')}<button type="button" class="secondary" id="bill-add">＋ Dodaj rachunek</button><div class="action-grid" style="margin-top:18px"><button class="primary" type="submit">Zapisz rachunki</button><button class="secondary" type="button" id="bill-back">Wróć</button></div></form>`}function periodExpenses(period){let y=month.slice(0,4),m=Number(month.slice(5,7));return db.expenses.filter(e=>period==='year'?e.date.startsWith(y):period==='quarter'?e.date.slice(0,4)===y&&Math.floor((Number(e.date.slice(5,7))-1)/3)===Math.floor((m-1)/3):e.date.slice(0,7)===month)}function stats(){let a=periodExpenses(reportPeriod),byCat=db.categories.map(c=>({name:c,value:sum(a.filter(e=>e.category===c))})).filter(x=>x.value>0).sort((x,y)=>y.value-x.value),total=sum(a);return `<h2>Statystyki</h2><div class="period-tabs">${[['month','Miesiąc'],['quarter','Kwartał'],['year','Rok']].map(([v,t])=>`<button class="${reportPeriod===v?'selected':''}" data-period="${v}">${t}</button>`).join('')}</div>${selectMonth()}<section class="card hero"><div class="label">Łącznie w okresie</div><div class="big">${money(total)}</div><button class="hero-link" data-stat-detail="all">Pełna historia ›</button></section><div class="summary-grid"><button class="card stat-button" data-stat-detail="shared"><small>Wspólne</small><b>${money(sum(a.filter(e=>e.visibility==='shared')))}</b><span>Historia ›</span></button><button class="card stat-button" data-stat-detail="private"><small>Prywatne</small><b>${money(sum(a.filter(e=>e.visibility==='private')))}</b><span>Historia ›</span></button></div><section class="card"><h3>Kategorie</h3>${byCat.length?byCat.map(c=>`<button class="stat-line" data-stat-category="${esc(c.name)}"><span>${esc(c.name)}</span><b>${money(c.value)}</b><div class="bar"><div class="fill" style="width:${total?c.value/total*100:0}%"></div></div><small>Pełna historia ›</small></button>`).join(''):'<div class="empty">Brak danych</div>'}</section><section class="card"><h3>Wydatki według domownika</h3>${db.members.map(m=>`<button class="stat-line" data-stat-member="${esc(m.id)}"><span>${esc(m.name)}</span><b>${money(sum(a.filter(e=>e.memberId===m.id)))}</b><small>Pełna historia ›</small></button>`).join('')}</section>`}
function settings(){return `<h2>Ustawienia</h2><section class="card"><h3>Synchronizacja plikowa</h3><p class="notice">Wspólny format .portfel dla Androida i iPhone’a. Import scala wpisy ze wszystkich okresów, nie zmieniając wyglądu aplikacji. Synchronizacja polis, usunięć i konfliktów jest nadal rozwijana. Importuj tylko z zaufanych źródeł.</p><div class="row"><button class="primary" id="sync-share">Wyślij .portfel</button><button class="primary" id="sync-export">Eksport .portfel</button><button class="secondary" id="sync-import">Scal plik .portfel</button><input type="file" id="sync-file" accept=".portfel,application/json" class="hidden"></div></section><section class="card"><h3>Układ kafelków i kategorie</h3><p class="notice">Zaznacz kategorie widoczne jako szybkie wpisy na pulpicie. Wszystkie kategorie nadal będą dostępne po kliknięciu Dodaj.</p><p class="notice">Strzałkami ustaw kolejność kafelków na ekranie dodawania wydatków.</p>${db.categories.map((c,i)=>`<div class="line"><label class="quick-config"><input type="checkbox" data-quick-category="${esc(c)}" ${db.quickCategories.includes(c)?'checked':''}><span>${esc(c)}</span></label><div class="row"><button class="secondary" data-cat-up="${i}" ${i===0?'disabled':''} aria-label="Przesuń w górę">↑</button><button class="secondary" data-cat-down="${i}" ${i===db.categories.length-1?'disabled':''} aria-label="Przesuń w dół">↓</button><button class="secondary" data-rename-category="${esc(c)}">Edytuj</button><button class="secondary danger" data-delete-category="${esc(c)}">×</button></div></div>`).join('')}<button class="secondary" id="new-category">+ Dodaj kategorię</button></section><section class="card"><h3>Użytkownicy i uprawnienia</h3><p class="notice">Dodawaj domowników, zmieniaj nazwy i przydzielaj role. Role administratora obowiązują lokalnie; import pliku nie nadaje uprawnień na innym urządzeniu.</p>${db.members.map(m=>`<div class="line"><div class="grow"><b>${esc(m.name)}</b><br><small>${m.role==='admin'?'Administrator':'Użytkownik'}</small></div><div class="row"><button class="secondary" data-rename-member="${esc(m.id)}">Zmień nazwę</button><button class="secondary" data-role-member="${esc(m.id)}">${m.role==='admin'?'Odbierz rolę':'Nadaj administratora'}</button></div></div>`).join('')}<button class="secondary" id="new-member">+ Dodaj domownika</button></section><section class="card"><h3>🔐 PIN administratora i usuwanie</h3><p class="notice">${localStorage.getItem('portfel_admin_pin_v1')?'PIN jest aktywny. Usuwanie danych i kont wymaga autoryzacji.':'Ustaw PIN administratora przed usuwaniem danych i kont. Bez PIN-u usuwanie jest zablokowane.'}</p><button class="secondary" id="pin-config">${localStorage.getItem('portfel_admin_pin_v1')?'Zmień PIN administratora':'Ustaw PIN administratora'}</button><h4>Usuń użytkownika</h4><p class="notice">Usunięcie konta wymaga potwierdzenia PIN-em. Sprawdź wcześniej kopię zapasową.</p>${db.members.map(m=>`<div class="line"><span>${esc(m.name)}</span><button class="secondary danger" data-remove-member="${esc(m.id)}">Usuń</button></div>`).join('')}</section><section class="card"><h3>✉️ Zaproś użytkownika</h3><p class="notice">Android: wyślij bezpośrednio aktualny instalator APK i plik synchronizacji. iPhone: wyślij link HTTPS do aplikacji webowej.</p><form id="invite-member" class="invite-form"><label>Imię odbiorcy<input name="inviteName" type="text" required placeholder="np. Kasia"></label><label>E-mail odbiorcy (opcjonalnie przy udostępnianiu Android)<input name="inviteEmail" type="email" placeholder="adres@example.com"></label><label>System telefonu<select name="invitePlatform" id="invite-platform"><option value="android">Android · wyślij APK i synchronizację</option><option value="ios">iPhone · link HTTPS</option></select></label><input type="hidden" name="inviteChannel" value="choose"><label id="invite-url-wrap" style="display:none">Adres instalacji na iPhone (HTTPS)<input id="invite-url" name="inviteUrl" type="url" placeholder="https://..." value="${esc(localStorage.getItem('portfel_ios_url')||'')}"></label><button type="submit" id="invite-submit">📤 Udostępnij APK i synchronizację</button></form><p class="notice">Android: wybierz komunikator lub e-mail w systemowym menu udostępniania. Niektóre aplikacje mogą odrzucać pliki APK. iPhone: wiadomość e-mail z podanym adresem HTTPS. Udostępnianie plików nie jest automatyczną synchronizacją urządzeń.</p></section><section class="card"><h3>Kopia zapasowa</h3><p class="notice">Dane są przechowywane na tym urządzeniu. Przed zmianą telefonu lub odinstalowaniem aplikacji wykonaj kopię JSON.</p><div class="row"><button class="primary" id="export">Eksport JSON</button><button class="secondary" id="import-btn">Import JSON</button><button class="secondary" id="csv">Eksport CSV</button><input type="file" id="import-file" accept="application/json,.json" class="hidden"></div></section><section class="card" style="border:1px solid #8d454c"><h3>Usuwanie danych</h3><p class="notice">Wyczyść wszystkie wydatki, rachunki i polisy, zachowując domowników, własne kategorie, ich kolejność i ustawienia aplikacji.</p><button class="secondary danger" id="clear-entries">🗑 Usuń wszystkie wpisy</button><p class="notice">Możesz też przywrócić aplikację do stanu początkowego. Ta opcja usuwa również domowników, własne kategorie i ustawienia.</p><button class="secondary danger" id="factory-reset">Przywróć ustawienia fabryczne</button><p class="notice">Obie operacje są nieodwracalne bez wcześniejszej kopii JSON.</p></section>`}function refreshInstallments(){let f=$('expense');if(!f||!f.querySelector('[name="paymentMode"]'))return;let active=f.querySelector('[name="paymentMode"]:checked')?.value==='installments',box=$('installment-fields');box.hidden=!active;if(!active)return;let n=Number($('installment-count').value),old=editing?db.expenses.find(e=>e.id===editing):null,first=f.querySelector('[name="date"]')?.value||selectedDay;let schedule=$('installment-schedule');let current=Array.from(schedule.querySelectorAll('.installment-row')).map(row=>({due:row.querySelector('[name="installmentDate"]')?.value||'',paidAt:row.querySelector('[name="installmentPaidAt"]')?.value||'',amount:row.querySelector('[name="installmentAmount"]')?.value||''}));schedule.innerHTML=Array.from({length:n-1},(_,i)=>{let d=new Date(first+'T12:00:00');d.setMonth(d.getMonth()+i+1);let prior=old?.installmentPayments?.[i]||{};let due=current[i]?.due||old?.installmentDates?.[i]||d.toLocaleDateString('sv-SE');let paidAt=current[i]?.paidAt??prior.paidAt??(old?.installmentPaid?.[i]?due:'');let amount=current[i]?.amount??prior.amount??'';return `<div class="installment-row" style="padding:12px;margin:10px 0;border:1px solid #36718b;border-radius:12px"><b>Rata ${i+2}</b><div class="bill-fields"><label>Termin płatności<input type="date" name="installmentDate" required value="${esc(due)}"></label><label>Data zapłaty<input type="date" name="installmentPaidAt" value="${esc(paidAt)}"></label></div><label>Wpłacona kwota (zł)<input type="number" min="0" step="0.01" inputmode="decimal" name="installmentAmount" placeholder="0,00" value="${esc(amount)}"></label></div>`}).join('')}function goBack(){if(tab==='add'){if(editing){editing=null;addStep='category';chosenCategory=null;tab='history'}else if(addStep==='form'){addStep='category';chosenCategory=null}else tab='home'}else if(tab!=='home')tab='home';render()}function render(){document.body.classList.toggle('light',db.theme==='light');$('app').innerHTML=({home,history,add,stats,settings}[tab])();$('back-top').hidden=tab==='home';if(tab==='add')refreshInstallments();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}const PIN_KEY='portfel_admin_pin_v1';
async function pinHash(pin,salt){const bytes=new TextEncoder().encode(salt+':'+pin);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function authorizeDeletion(){const record=localStorage.getItem(PIN_KEY);if(!record){alert('Najpierw ustaw PIN administratora w Ustawieniach. Usuwanie jest zablokowane.');return false}if(!crypto.subtle){alert('Ta przeglądarka nie obsługuje bezpiecznej weryfikacji PIN.');return false}let data;try{data=JSON.parse(record)}catch{return false}const pin=prompt('Podaj PIN administratora, aby zatwierdzić usunięcie:');if(pin===null)return false;const ok=await pinHash(pin,data.salt)===data.hash;if(!ok)alert('Nieprawidłowy PIN administratora.');return ok}
async function configurePin(){if(!crypto.subtle)return alert('Ta przeglądarka nie obsługuje bezpiecznego ustawiania PIN.');if(localStorage.getItem(PIN_KEY)){if(!await authorizeDeletion())return}const pin=prompt('Ustaw nowy PIN administratora (4–8 cyfr):');if(pin===null)return;if(!/^\d{4,8}$/.test(pin))return alert('PIN musi mieć 4–8 cyfr.');const again=prompt('Powtórz nowy PIN:');if(again!==pin)return alert('Kody PIN nie są identyczne.');const salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem(PIN_KEY,JSON.stringify({salt,hash:await pinHash(pin,salt)}));alert('PIN administratora został ustawiony.');render()}
window.portfelImportFromAndroid=function(encoded){try{const binary=atob(encoded),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const input=document.getElementById('sync-file');if(!input)throw Error('Nie znaleziono modułu importu');const transfer=new DataTransfer();transfer.items.add(new File([bytes],'PORTFEL_SYNC.portfel',{type:'application/octet-stream'}));input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){alert('Nie można otworzyć pliku synchronizacji: '+e.message)}};
function syncPayload(){return {app:'PORTFEL_SYNC',schema:1,exportedAt:new Date().toISOString(),members:db.members,categories:db.categories,billItems:db.billItems,expenses:db.expenses.filter(e=>e.visibility==='shared'),deletedIds:db.deletedIds||[]};}
function syncBase64(content){const bytes=new TextEncoder().encode(content);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(binary)}
async function shareSyncFile(){const data=JSON.stringify(syncPayload());if(window.PortfelAndroid?.shareSyncOnly){window.PortfelAndroid.shareSyncOnly(syncBase64(data));return;}const file=new File([data],'PORTFEL_SYNC.portfel',{type:'application/octet-stream'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({files:[file],title:'PORTFEL+ · synchronizacja'});return}catch(e){if(e.name==='AbortError')return;}}saveExportFile('PORTFEL_SYNC.portfel','application/octet-stream',data);alert('Zapisano plik .portfel. Możesz go wysłać jako załącznik.')}
function saveExportFile(filename,mime,content){if(window.PortfelAndroid&&typeof window.PortfelAndroid.exportFile==='function'){const bytes=new TextEncoder().encode(content);let binary='';for(let i=0;i<bytes.length;i+=8192){binary+=String.fromCharCode(...bytes.subarray(i,i+8192));}window.PortfelAndroid.exportFile(filename,mime,btoa(binary));return;}const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
