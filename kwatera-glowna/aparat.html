<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aparat – podgląd</title><style>
*{box-sizing:border-box}body{margin:0;background:#101316;color:#f4f6f8;font:16px system-ui;max-width:660px;margin:auto;padding:16px}h1{font-size:21px;margin:0 0 12px}button,.file{background:#29333d;color:white;border:1px solid #44515d;border-radius:12px;padding:12px;font:inherit;text-align:center;cursor:pointer}button:disabled{opacity:.4}button.primary{background:#176b58;border-color:#359d84}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.bar>*{flex:1}#view{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:16px;background:#20262b;border:1px solid #39434c;display:grid;place-items:center}video,#photo{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}#grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33.1%,#fff 33.1%,#fff 33.5%,transparent 33.5%,transparent 66.4%,#fff 66.4%,#fff 66.8%,transparent 66.8%),linear-gradient(to bottom,transparent 33.1%,#fff 33.1%,#fff 33.5%,transparent 33.5%,transparent 66.4%,#fff 66.4%,#fff 66.8%,transparent 66.8%);opacity:.45}#grid.round{background:none;display:grid;place-items:center}#grid.round::after{content:'';display:block;width:75%;aspect-ratio:1;border:2px solid white;border-radius:50%;box-shadow:0 0 2px #000}#hint{color:#aeb9c1;text-align:center;padding:20px}label.control{display:flex;align-items:center;gap:12px;margin:12px 0}input[type=range]{flex:1;min-width:0;accent-color:#62d5b7}#status{color:#c6d0d7;font-size:14px;min-height:24px}[hidden]{display:none!important}small{color:#adb8c0}</style><body><h1>Aparat · tryb fotograficzny</h1><label class="control" for="photoType">Rodzaj dokumentacji <select id="photoType" style="flex:1;background:#29333d;color:white;border:1px solid #44515d;border-radius:10px;padding:10px;font:inherit"><option value="ogolne">Zdjęcie ogólne</option><option value="TS-2">TS-2 (zdjęcie)</option></select></label><div id="view"><div id="hint">Włącz aparat lub wybierz zdjęcie.</div><video id="video" autoplay playsinline muted hidden></video><img id="photo" alt="Podgląd zdjęcia" hidden><div id="grid"></div></div><div class="bar"><button id="start">Włącz aparat</button><button id="capture" class="primary" disabled>Zrób zdjęcie</button><button id="stop" disabled>Zamknij aparat</button></div><div class="bar"><label class="file">Wybierz zdjęcie<input id="file" type="file" accept="image/*" hidden></label><button id="torch" disabled>Lampa</button><button id="save" disabled>Zapisz JPEG</button></div><label class="control"><input id="show" type="checkbox" checked> Pokaż ramkę</label><label class="control" for="frame">Kadrowanie <select id="frame" style="flex:1;background:#29333d;color:white;border:1px solid #44515d;border-radius:10px;padding:10px;font:inherit"><option value="grid">Siatka 3×3</option><option value="round">Ramka okrągła</option></select></label><label class="control">Widoczność <input id="opacity" type="range" min="0" max="100" value="45"></label><label class="control">Jasność <input id="brightness" type="range" min="50" max="150" value="100"></label><label class="control">Kontrast <input id="contrast" type="range" min="50" max="150" value="100"></label><div id="status" role="status"></div><small>Zdjęcia są przetwarzane lokalnie. Dostęp do kamery zależy od uprawnień przeglądarki. Siatka nie jest zapisywana na zdjęciu.</small><script>
const $=id=>document.getElementById(id),v=$('video'),p=$('photo'),g=$('grid');let stream=null,source=null,url=null,lit=false;const say=t=>$('status').textContent=t;function filters(){const f='brightness('+$('brightness').value+'%) contrast('+$('contrast').value+'%)';v.style.filter=p.style.filter=f;return f}function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;v.hidden=true;lit=false;$('torch').disabled=true;$('torch').textContent='Lampa';$('capture').disabled=true;$('stop').disabled=true;$('start').disabled=false;if(!source)$('hint').hidden=false}function display(blob){stop();source=null;$('save').disabled=true;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);p.onload=()=>{source=p;$('save').disabled=false;say('Zdjęcie gotowe do zapisu.')};p.onerror=()=>{source=null;$('save').disabled=true;say('Nie można otworzyć zdjęcia.')};p.src=url;p.hidden=false;$('hint').hidden=true}$('start').onclick=async()=>{stop();$('start').disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Brak dostępu do kamery w tym kontekście.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});source=null;$('save').disabled=true;p.hidden=true;v.srcObject=stream;v.hidden=false;$('hint').hidden=true;await v.play();$('capture').disabled=false;$('stop').disabled=false;$('torch').disabled=!stream.getVideoTracks()[0].getCapabilities?.().torch;say('Aparat aktywny.')}catch(e){stop();say(e.message+' Możesz użyć opcji Wybierz zdjęcie.')}};$('stop').onclick=()=>{stop();say('Aparat zamknięty.')};$('torch').onclick=async()=>{try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:!lit}]});lit=!lit;$('torch').textContent=lit?'Lampa: wł.':'Lampa'}catch(e){say('Lampa niedostępna.')}};$('capture').onclick=()=>{if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{if(b)display(b)},'image/jpeg',.95)};$('file').onchange=e=>{if(e.target.files[0])display(e.target.files[0]);e.target.value=''};$('save').onclick=()=>{if(!source||!source.naturalWidth)return;const c=document.createElement('canvas');c.width=source.naturalWidth;c.height=source.naturalHeight;const ctx=c.getContext('2d');ctx.filter=filters();ctx.drawImage(source,0,0);c.toBlob(b=>{if(!b)return;const a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=$('photoType').value+'-'+Date.now()+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/jpeg',.95)};$('show').onchange=()=>g.hidden=!$('show').checked;$('frame').onchange=()=>g.classList.toggle('round',$('frame').value==='round');$('opacity').oninput=()=>g.style.opacity=$('opacity').value/100;$('brightness').oninput=$('contrast').oninput=filters;window.addEventListener('pagehide',stop);</script></body></html>
