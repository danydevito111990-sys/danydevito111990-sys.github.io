name: Build PORTFEL+ signed Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'portfel-android/**'
      - '.github/workflows/portfel-android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35"
      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.PORTFEL_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PORTFEL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTFEL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTFEL_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "::error::Configure PORTFEL signing secrets before building"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/portfel-release.jks"
          chmod 600 "$RUNNER_TEMP/portfel-release.jks"
      - name: Build stable signed release APK
        working-directory: portfel-android
        env:
          PORTFEL_KEYSTORE_PATH: ${{ runner.temp }}/portfel-release.jks
          PORTFEL_KEYSTORE_PASSWORD: ${{ secrets.PORTFEL_KEYSTORE_PASSWORD }}
          PORTFEL_KEY_ALIAS: ${{ secrets.PORTFEL_KEY_ALIAS }}
          PORTFEL_KEY_PASSWORD: ${{ secrets.PORTFEL_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PORTFEL-PLUS-STABLE-SIGNED-APK
          path: portfel-android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare public installer asset
        run: cp portfel-android/app/build/outputs/apk/release/app-release.apk PORTFEL_PLUS.apk
      - name: Publish or replace stable release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portfel-latest
          name: PORTFEL+ - aktualny instalator Android
          body: Czysta instalacja bez danych rodzinnych i synchronizacji. Plik PORTFEL_SYNC.portfel przesyła się osobno.
          files: PORTFEL_PLUS.apk
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
      - name: Verify public installer exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view portfel-latest --json assets --jq '.assets[].name' | grep -Fx PORTFEL_PLUS.apk
