name: Build PORTFEL+ install icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'portfel-plus/icon.svg'
      - '.github/workflows/portfel-icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url="portfel-plus/icon.svg",write_to=f"portfel-plus/icon-{size}.png",output_width=size,output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfel-plus/icon-192.png portfel-plus/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Add installable PNG icons for PORTFEL+"
            git push
          fi
